<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 345" role="img" aria-labelledby="title desc"><title id="title">常见数据光盘容量</title><desc id="desc">CD、DVD、BD 的常见容量以及一次写入和可擦写类型。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7195"/></marker></defs><rect width="960" height="345" fill="#f6fafc"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="30" y="48" text-anchor="start" font-size="27" font-weight="800" fill="#17364a">CD、DVD 与 BD 的常见容量</text><rect x="30" y="75" width="280" height="190" rx="16" fill="#e7f5fb" stroke="#c8dce5" stroke-width="2"/><text x="50" y="112" text-anchor="start" font-size="22" font-weight="750" fill="#0e7195">CD</text><text x="50" y="144" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">700 MB：最常见</text><text x="50" y="170" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">CD-R：一次写入</text><text x="50" y="196" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">CD-RW：可擦写</text><rect x="340" y="75" width="280" height="190" rx="16" fill="#e9f7f5" stroke="#c8dce5" stroke-width="2"/><text x="360" y="112" text-anchor="start" font-size="22" font-weight="750" fill="#157d76">DVD</text><text x="360" y="144" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">4.7 GB：单面单层</text><text x="360" y="170" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">8.5 GB：单面双层</text><text x="360" y="196" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">±R 一次写；±RW 可擦写</text><rect x="650" y="75" width="280" height="190" rx="16" fill="#fff3e8" stroke="#c8dce5" stroke-width="2"/><text x="670" y="112" text-anchor="start" font-size="22" font-weight="750" fill="#b55e2d">BD / BDXL</text><text x="670" y="144" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">25 / 50 GB：一层 / 两层</text><text x="670" y="170" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">100 / 128 GB：三层 / 四层</text><text x="670" y="196" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">BD-R 一次写；BD-RE 可擦写</text><rect x="30" y="286" width="900" height="42" rx="9" fill="#fff" stroke="#c8dce5" stroke-width="2"/><text x="480" y="313" text-anchor="middle" font-size="17" font-weight="400" fill="#17364a">50 GB 的 BD-R DL 和 BD-RE DL 容量相同，前者一次写入，后者可以擦写。</text></g></svg>