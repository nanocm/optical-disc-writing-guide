<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">ImgBurn 镜像写入与数据盘构建</title><desc id="desc">Write image 使用镜像中的文件系统；Build 根据普通文件新建文件系统。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7195"/></marker></defs><rect width="960" height="390" fill="#f6fafc"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="30" y="47" text-anchor="start" font-size="27" font-weight="800" fill="#17364a">ImgBurn 的两种写入方式</text><text x="30" y="110" text-anchor="start" font-size="19" font-weight="750" fill="#0e7195">已有镜像</text><rect x="170" y="75" width="210" height="115" rx="16" fill="#e7f5fb" stroke="#c8dce5" stroke-width="2"/><text x="190" y="112" text-anchor="start" font-size="22" font-weight="750" fill="#0e7195">已有 .iso</text><text x="190" y="144" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">文件系统与启动结构</text><text x="190" y="170" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">已经排在镜像里</text><path d="M385 132 L420 132" fill="none" stroke="#0e7195" stroke-width="3" marker-end="url(#arrow)"/><rect x="430" y="75" width="210" height="115" rx="16" fill="#e9f7f5" stroke="#c8dce5" stroke-width="2"/><text x="450" y="112" text-anchor="start" font-size="22" font-weight="750" fill="#157d76">Write image file</text><text x="450" y="144" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">按镜像结构写入</text><text x="450" y="170" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">不重选 UDF</text><path d="M645 132 L680 132" fill="none" stroke="#0e7195" stroke-width="3" marker-end="url(#arrow)"/><rect x="690" y="75" width="240" height="115" rx="16" fill="#fff3e8" stroke="#c8dce5" stroke-width="2"/><text x="710" y="112" text-anchor="start" font-size="22" font-weight="750" fill="#b55e2d">得到镜像光盘</text><text x="710" y="144" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">可继续测试启动</text><text x="710" y="170" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">及目标设备读取</text><text x="30" y="270" text-anchor="start" font-size="19" font-weight="750" fill="#157d76">普通文件</text><rect x="170" y="235" width="210" height="115" rx="16" fill="#e7f5fb" stroke="#c8dce5" stroke-width="2"/><text x="190" y="272" text-anchor="start" font-size="22" font-weight="750" fill="#0e7195">普通文件夹</text><text x="190" y="304" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">照片、文档、压缩包</text><text x="190" y="330" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">或一个 .iso 文件</text><path d="M385 292 L420 292" fill="none" stroke="#0e7195" stroke-width="3" marker-end="url(#arrow)"/><rect x="430" y="235" width="210" height="115" rx="16" fill="#e9f7f5" stroke="#c8dce5" stroke-width="2"/><text x="450" y="272" text-anchor="start" font-size="22" font-weight="750" fill="#157d76">Build 数据盘</text><text x="450" y="304" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">Write files/folders</text><text x="450" y="330" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">选择文件系统与卷标</text><path d="M645 292 L680 292" fill="none" stroke="#0e7195" stroke-width="3" marker-end="url(#arrow)"/><rect x="690" y="235" width="240" height="115" rx="16" fill="#fff3e8" stroke="#c8dce5" stroke-width="2"/><text x="710" y="272" text-anchor="start" font-size="22" font-weight="750" fill="#b55e2d">得到数据光盘</text><text x="710" y="304" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">若源仅是 .iso 文件</text><text x="710" y="330" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">盘上也只见该文件</text></g></svg>