<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">Windows Live 与 Mastered</title><desc id="desc">Live 在复制时逐步写盘；Mastered 先列入待刻录文件，点击刻录后才写盘。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7195"/></marker></defs><rect width="960" height="390" fill="#f6fafc"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="30" y="47" text-anchor="start" font-size="27" font-weight="800" fill="#17364a">Windows 的两种数据盘写入方式</text><text x="30" y="110" text-anchor="start" font-size="18" font-weight="750" fill="#0e7195">像 U 盘一样使用</text><rect x="220" y="75" width="195" height="118" rx="16" fill="#e7f5fb" stroke="#c8dce5" stroke-width="2"/><text x="240" y="112" text-anchor="start" font-size="22" font-weight="750" fill="#0e7195">初始化 UDF</text><text x="240" y="144" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">可能占用少量空间</text><text x="240" y="170" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">不是整盘清零</text><path d="M420 132 L450 132" fill="none" stroke="#0e7195" stroke-width="3" marker-end="url(#arrow)"/><rect x="460" y="75" width="195" height="118" rx="16" fill="#e9f7f5" stroke="#c8dce5" stroke-width="2"/><text x="480" y="112" text-anchor="start" font-size="22" font-weight="750" fill="#157d76">复制时写入</text><text x="480" y="144" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">逐步追加或更新</text><text x="480" y="170" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">盘型影响保存行为</text><path d="M660 132 L690 132" fill="none" stroke="#0e7195" stroke-width="3" marker-end="url(#arrow)"/><rect x="700" y="75" width="230" height="118" rx="16" fill="#fff3e8" stroke="#c8dce5" stroke-width="2"/><text x="720" y="112" text-anchor="start" font-size="22" font-weight="750" fill="#b55e2d">弹出后重插</text><text x="720" y="144" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">验证新旧文件</text><text x="720" y="170" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">可用哈希复查</text><text x="30" y="254" text-anchor="start" font-size="17" font-weight="750" fill="#157d76">与 CD/DVD 播放器</text><text x="30" y="278" text-anchor="start" font-size="17" font-weight="750" fill="#157d76">一起使用</text><rect x="220" y="235" width="195" height="118" rx="16" fill="#e7f5fb" stroke="#c8dce5" stroke-width="2"/><text x="240" y="272" text-anchor="start" font-size="22" font-weight="750" fill="#0e7195">文件先排队</text><text x="240" y="304" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">准备好写入</text><text x="240" y="330" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">尚未刻到盘上</text><path d="M420 292 L450 292" fill="none" stroke="#0e7195" stroke-width="3" marker-end="url(#arrow)"/><rect x="460" y="235" width="195" height="118" rx="16" fill="#e9f7f5" stroke="#c8dce5" stroke-width="2"/><text x="480" y="272" text-anchor="start" font-size="22" font-weight="750" fill="#157d76">执行刻录</text><text x="480" y="304" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">写入一批文件</text><text x="480" y="330" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">再添加前查会话</text><path d="M660 292 L690 292" fill="none" stroke="#0e7195" stroke-width="3" marker-end="url(#arrow)"/><rect x="700" y="235" width="230" height="118" rx="16" fill="#fff3e8" stroke="#c8dce5" stroke-width="2"/><text x="720" y="272" text-anchor="start" font-size="22" font-weight="750" fill="#b55e2d">弹出后重插</text><text x="720" y="304" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">检查文件与会话</text><text x="720" y="330" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">再判断是否追加</text></g></svg>