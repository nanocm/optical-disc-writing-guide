<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="title desc"><title id="title">按用途选择可录光盘</title><desc id="desc">可擦写盘用于频繁修改；旧设备读取应测试 DVD 格式；较大的固定备份可使用 BD-R。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7195"/></marker></defs><rect width="960" height="330" fill="#f6fafc"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="30" y="47" text-anchor="start" font-size="27" font-weight="800" fill="#17364a">常见用途与盘片选择</text><rect x="30" y="80" width="280" height="158" rx="16" fill="#e7f5fb" stroke="#c8dce5" stroke-width="2"/><text x="50" y="117" text-anchor="start" font-size="22" font-weight="750" fill="#0e7195">反复修改文件</text><text x="50" y="149" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">DVD±RW / BD-RE</text><text x="50" y="175" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">可擦除并重新使用</text><text x="50" y="201" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">适合临时更新</text><rect x="340" y="80" width="280" height="158" rx="16" fill="#e9f7f5" stroke="#c8dce5" stroke-width="2"/><text x="360" y="117" text-anchor="start" font-size="22" font-weight="750" fill="#157d76">交给旧设备读取</text><text x="360" y="149" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">DVD±R 4.7 / 8.5 GB</text><text x="360" y="175" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">实测盘型与文件系统</text><text x="360" y="201" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">播放器另查视频格式</text><rect x="650" y="80" width="280" height="158" rx="16" fill="#fff3e8" stroke="#c8dce5" stroke-width="2"/><text x="670" y="117" text-anchor="start" font-size="22" font-weight="750" fill="#b55e2d">保存较大文件</text><text x="670" y="149" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">BD-R 25 / 50 GB</text><text x="670" y="175" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">超过 50 GB 可看 BDXL</text><text x="670" y="201" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">核对光驱写入 Profile</text><rect x="30" y="264" width="900" height="48" rx="9" fill="#fff" stroke="#c8dce5" stroke-width="2"/><text x="480" y="294" text-anchor="middle" font-size="17" font-weight="400" fill="#17364a">新批次先试刻一张，完成 Verify 和重插读回。重要资料再留一份副本。</text></g></svg>