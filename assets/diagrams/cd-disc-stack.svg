<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 575" role="img" aria-labelledby="title desc"><title id="title">CD-ROM、CD-R 与 CD-RW 的盘体剖面</title><desc id="desc">从上方印刷面到下方读盘面展示 CD-ROM、CD-R、CD-RW。三者都从约 1.2 毫米聚碳酸酯基板一侧读取；记录区与反射层靠近顶面，薄层放大绘制。</desc><defs><marker id="beam-up" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0f7d99"/></marker><marker id="beam-down" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0f7d99"/></marker></defs><rect x="0" y="0" width="960" height="575" rx="0" fill="#f6fafc" stroke="none" /><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="30" y="45" text-anchor="start" font-size="28" font-weight="800" fill="#17364a"><tspan x="30" dy="0">CD：记录区靠近印刷面</tspan></text><text x="30" y="72" text-anchor="start" font-size="16" font-weight="400" fill="#486476"><tspan x="30" dy="0">由上往下看；彩色薄层刻意放大，不能用图上高度推算厚度。</tspan></text><rect x="25" y="91" width="290" height="431" rx="16" fill="#ffffff" stroke="#bfd5df" stroke-width="2"/><text x="45" y="125" text-anchor="start" font-size="20" font-weight="760" fill="#17364a"><tspan x="45" dy="0">CD-ROM</tspan></text><text x="45" y="150" text-anchor="start" font-size="15" font-weight="400" fill="#486476"><tspan x="45" dy="0">模压凹坑；无独立染料层</tspan></text><rect x="45" y="170" width="120" height="18" rx="0" fill="#eac5a7" stroke="#7998aa" stroke-width="1"/><rect x="45" y="188" width="120" height="16" rx="0" fill="#91c8d8" stroke="#7998aa" stroke-width="1"/><rect x="45" y="204" width="120" height="14" rx="0" fill="#9eafbb" stroke="#7998aa" stroke-width="1"/><rect x="54" y="212" width="9" height="5" rx="0" fill="#ffffff" stroke="none" /><rect x="77" y="212" width="9" height="5" rx="0" fill="#ffffff" stroke="none" /><rect x="100" y="212" width="9" height="5" rx="0" fill="#ffffff" stroke="none" /><rect x="123" y="212" width="9" height="5" rx="0" fill="#ffffff" stroke="none" /><rect x="146" y="212" width="9" height="5" rx="0" fill="#ffffff" stroke="none" /><rect x="45" y="218" width="120" height="228" rx="0" fill="#d5e8f4" stroke="#7998aa" stroke-width="1"/><rect x="45" y="170" width="120" height="276" rx="1" fill="none" stroke="#597c90" stroke-width="1.5"/><rect x="183" y="175" width="14" height="14" rx="2" fill="#eac5a7" stroke="#7896a8" /><text x="206" y="187" text-anchor="start" font-size="13" font-weight="400" fill="#17364a"><tspan x="206" dy="0">印刷／标签</tspan><tspan x="206" dy="14.95">（可选）</tspan></text><rect x="183" y="228" width="14" height="14" rx="2" fill="#91c8d8" stroke="#7896a8" /><text x="206" y="240" text-anchor="start" font-size="13" font-weight="400" fill="#17364a"><tspan x="206" dy="0">薄漆保护层</tspan></text><rect x="183" y="281" width="14" height="14" rx="2" fill="#9eafbb" stroke="#7896a8" /><text x="206" y="293" text-anchor="start" font-size="13" font-weight="400" fill="#17364a"><tspan x="206" dy="0">模压凹坑</tspan><tspan x="206" dy="14.95">＋金属反射层</tspan></text><rect x="183" y="334" width="14" height="14" rx="2" fill="#d5e8f4" stroke="#7896a8" /><text x="206" y="346" text-anchor="start" font-size="13" font-weight="400" fill="#17364a"><tspan x="206" dy="0">约 1.2 mm</tspan><tspan x="206" dy="14.95">基板</tspan></text><path d="M105 476 L105 450" stroke="#0f7d99" stroke-width="2.5" fill="none" marker-end="url(#beam-up)"/><text x="121" y="471" text-anchor="start" font-size="14" font-weight="400" fill="#0d728e"><tspan x="121" dy="0">光从下方入射</tspan></text><rect x="335" y="91" width="290" height="431" rx="16" fill="#ffffff" stroke="#bfd5df" stroke-width="2"/><text x="355" y="125" text-anchor="start" font-size="20" font-weight="760" fill="#17364a"><tspan x="355" dy="0">CD-R</tspan></text><text x="355" y="150" text-anchor="start" font-size="15" font-weight="400" fill="#486476"><tspan x="355" dy="0">一次写入；有机染料</tspan></text><rect x="355" y="170" width="120" height="18" rx="0" fill="#eac5a7" stroke="#7998aa" stroke-width="1"/><rect x="355" y="188" width="120" height="16" rx="0" fill="#91c8d8" stroke="#7998aa" stroke-width="1"/><rect x="355" y="204" width="120" height="14" rx="0" fill="#9eafbb" stroke="#7998aa" stroke-width="1"/><rect x="355" y="218" width="120" height="15" rx="0" fill="#e9a565" stroke="#7998aa" stroke-width="1"/><rect x="355" y="233" width="120" height="213" rx="0" fill="#d5e8f4" stroke="#7998aa" stroke-width="1"/><rect x="355" y="170" width="120" height="276" rx="1" fill="none" stroke="#597c90" stroke-width="1.5"/><rect x="493" y="175" width="14" height="14" rx="2" fill="#eac5a7" stroke="#7896a8" /><text x="516" y="187" text-anchor="start" font-size="13" font-weight="400" fill="#17364a"><tspan x="516" dy="0">印刷／标签</tspan><tspan x="516" dy="14.95">（可选）</tspan></text><rect x="493" y="223" width="14" height="14" rx="2" fill="#91c8d8" stroke="#7896a8" /><text x="516" y="235" text-anchor="start" font-size="13" font-weight="400" fill="#17364a"><tspan x="516" dy="0">薄漆保护层</tspan></text><rect x="493" y="271" width="14" height="14" rx="2" fill="#9eafbb" stroke="#7896a8" /><text x="516" y="283" text-anchor="start" font-size="13" font-weight="400" fill="#17364a"><tspan x="516" dy="0">金属反射层</tspan></text><rect x="493" y="319" width="14" height="14" rx="2" fill="#e9a565" stroke="#7896a8" /><text x="516" y="331" text-anchor="start" font-size="13" font-weight="400" fill="#17364a"><tspan x="516" dy="0">有机染料</tspan><tspan x="516" dy="14.95">记录层</tspan></text><rect x="493" y="367" width="14" height="14" rx="2" fill="#d5e8f4" stroke="#7896a8" /><text x="516" y="379" text-anchor="start" font-size="13" font-weight="400" fill="#17364a"><tspan x="516" dy="0">约 1.2 mm</tspan><tspan x="516" dy="14.95">基板</tspan></text><path d="M415 476 L415 450" stroke="#0f7d99" stroke-width="2.5" fill="none" marker-end="url(#beam-up)"/><text x="431" y="471" text-anchor="start" font-size="14" font-weight="400" fill="#0d728e"><tspan x="431" dy="0">光从下方入射</tspan></text><rect x="645" y="91" width="290" height="431" rx="16" fill="#ffffff" stroke="#bfd5df" stroke-width="2"/><text x="665" y="125" text-anchor="start" font-size="20" font-weight="760" fill="#17364a"><tspan x="665" dy="0">CD-RW</tspan></text><text x="665" y="150" text-anchor="start" font-size="15" font-weight="400" fill="#486476"><tspan x="665" dy="0">可擦写；相变记录膜</tspan></text><rect x="665" y="170" width="120" height="18" rx="0" fill="#eac5a7" stroke="#7998aa" stroke-width="1"/><rect x="665" y="188" width="120" height="16" rx="0" fill="#91c8d8" stroke="#7998aa" stroke-width="1"/><rect x="665" y="204" width="120" height="14" rx="0" fill="#9eafbb" stroke="#7998aa" stroke-width="1"/><rect x="665" y="218" width="120" height="7" rx="0" fill="#d4bfe4" stroke="#7998aa" stroke-width="1"/><rect x="665" y="225" width="120" height="12" rx="0" fill="#a981c9" stroke="#7998aa" stroke-width="1"/><rect x="665" y="237" width="120" height="7" rx="0" fill="#d4bfe4" stroke="#7998aa" stroke-width="1"/><rect x="665" y="244" width="120" height="202" rx="0" fill="#d5e8f4" stroke="#7998aa" stroke-width="1"/><rect x="665" y="170" width="120" height="276" rx="1" fill="none" stroke="#597c90" stroke-width="1.5"/><rect x="803" y="175" width="14" height="14" rx="2" fill="#eac5a7" stroke="#7896a8" /><text x="826" y="187" text-anchor="start" font-size="13" font-weight="400" fill="#17364a"><tspan x="826" dy="0">印刷／标签</tspan><tspan x="826" dy="14.95">（可选）</tspan></text><rect x="803" y="223" width="14" height="14" rx="2" fill="#91c8d8" stroke="#7896a8" /><text x="826" y="235" text-anchor="start" font-size="13" font-weight="400" fill="#17364a"><tspan x="826" dy="0">薄漆保护层</tspan></text><rect x="803" y="271" width="14" height="14" rx="2" fill="#9eafbb" stroke="#7896a8" /><text x="826" y="283" text-anchor="start" font-size="13" font-weight="400" fill="#17364a"><tspan x="826" dy="0">金属反射层</tspan></text><rect x="803" y="319" width="14" height="14" rx="2" fill="#a981c9" stroke="#7896a8" /><text x="826" y="331" text-anchor="start" font-size="13" font-weight="400" fill="#17364a"><tspan x="826" dy="0">相变膜＋</tspan><tspan x="826" dy="14.95">两侧介电层</tspan></text><rect x="803" y="367" width="14" height="14" rx="2" fill="#d5e8f4" stroke="#7896a8" /><text x="826" y="379" text-anchor="start" font-size="13" font-weight="400" fill="#17364a"><tspan x="826" dy="0">约 1.2 mm</tspan><tspan x="826" dy="14.95">基板</tspan></text><path d="M725 476 L725 450" stroke="#0f7d99" stroke-width="2.5" fill="none" marker-end="url(#beam-up)"/><text x="741" y="471" text-anchor="start" font-size="14" font-weight="400" fill="#0d728e"><tspan x="741" dy="0">光从下方入射</tspan></text><text x="30" y="552" text-anchor="start" font-size="17" font-weight="400" fill="#486476"><tspan x="30" dy="0">CD 顶面只有较薄的漆层护住反射层；深划伤可能直接损坏数据。</tspan></text></g></svg>