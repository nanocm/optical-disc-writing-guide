<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">读取光盘的四个条件</title><desc id="desc">光驱识别盘型，系统找到会话并挂载文件系统，应用程序再打开文件内容。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7195"/></marker></defs><rect width="960" height="300" fill="#f6fafc"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="30" y="48" text-anchor="start" font-size="27" font-weight="800" fill="#17364a">光盘无法读取时，依次检查</text><rect x="30" y="90" width="200" height="125" rx="16" fill="#e7f5fb" stroke="#c8dce5" stroke-width="2"/><text x="50" y="127" text-anchor="start" font-size="22" font-weight="750" fill="#0e7195">① 物理盘型</text><text x="50" y="159" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">光驱 Profile</text><text x="50" y="185" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">层数与读写能力</text><path d="M237 153 L262 153" fill="none" stroke="#0e7195" stroke-width="3" marker-end="url(#arrow)"/><rect x="270" y="90" width="200" height="125" rx="16" fill="#e9f7f5" stroke="#c8dce5" stroke-width="2"/><text x="290" y="127" text-anchor="start" font-size="22" font-weight="750" fill="#157d76">② 会话</text><text x="290" y="159" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">找到记录区</text><text x="290" y="185" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">选择可访问的目录</text><path d="M477 153 L502 153" fill="none" stroke="#0e7195" stroke-width="3" marker-end="url(#arrow)"/><rect x="510" y="90" width="200" height="125" rx="16" fill="#fff3e8" stroke="#c8dce5" stroke-width="2"/><text x="530" y="127" text-anchor="start" font-size="22" font-weight="750" fill="#b55e2d">③ 文件系统</text><text x="530" y="159" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">ISO 9660 / UDF</text><text x="530" y="185" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">版本与扩展支持</text><path d="M717 153 L742 153" fill="none" stroke="#0e7195" stroke-width="3" marker-end="url(#arrow)"/><rect x="750" y="90" width="180" height="125" rx="16" fill="#f1edfa" stroke="#c8dce5" stroke-width="2"/><text x="770" y="127" text-anchor="start" font-size="22" font-weight="750" fill="#71529a">④ 应用内容</text><text x="770" y="159" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">MKV、DVD-Video</text><text x="770" y="185" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">启动或加密要求</text><rect x="30" y="238" width="900" height="44" rx="9" fill="#fff" stroke="#c8dce5" stroke-width="2"/><text x="480" y="266" text-anchor="middle" font-size="17" font-weight="400" fill="#17364a">BDXL 数据可读，不代表设备能解码或播放商业 UHD 影片。</text></g></svg>