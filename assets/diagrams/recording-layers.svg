xt><rect x="730" y="90" width="210" height="488" rx="16" fill="#ffffff" stroke="#bfd5df" stroke-width="2"/><text x="746" y="125" text-anchor="start" font-size="19" font-weight="750" fill="#75539c"><tspan x="746" dy="0">BDXL QL</tspan></text><text x="746" y="152" text-anchor="start" font-size="16" font-weight="400" fill="#486476"><tspan x="746" dy="0">128 GB · 四层</tspan></text><rect x="764" y="181" width="118" height="17" rx="0" fill="#eac5a7" stroke="#7998aa" /><rect x="764" y="198" width="118" height="272" rx="0" fill="#d5e8f4" stroke="#7998aa" /><text x="823" y="270" text-anchor="middle" font-size="17" font-weight="400" fill="#486476"><tspan x="823" dy="0">约 1.1 mm</tspan><tspan x="823" dy="24">基板</tspan></text><rect x="764" y="465" width="118" height="10" rx="0" fill="#75539c" stroke="#5c7792" stroke-width="1"/><rect x="764" y="475" width="118" height="5" rx="0" fill="#d6e9d0" stroke="none" /><rect x="764" y="480" width="118" height="10" rx="0" fill="#75539c" stroke="#5c7792" stroke-width="1"/><rect x="764" y="490" width="118" height="5" rx="0" fill="#d6e9d0" stroke="none" /><rect x="764" y="495" width="118" height="10" rx="0" fill="#75539c" stroke="#5c7792" stroke-width="1"/><rect x="764" y="505" width="118" height="5" rx="0" fill="#d6e9d0" stroke="none" /><rect x="764" y="510" width="118" height="10" rx="0" fill="#75539c" stroke="#5c7792" stroke-width="1"/><rect x="764" y="520" width="118" height="23" rx="0" fill="#9dd9e4" stroke="#7998aa" /><rect x="764" y="543" width="118" height="10" rx="0" fill="#58b6ca" stroke="#7998aa" /><text x="823" y="536.5" text-anchor="middle" font-size="13" font-weight="400" fill="#17364a"><tspan x="823" dy="0">覆盖层</tspan></text><path d="M823 573 L823 557" stroke="#0f7d99" stroke-width="2.5" fill="none" marker-end="url(#beam-up)"/><text x="890" y="571" text-anchor="start" font-size="13" font-weight="400" fill="#0d728e"><tspan x="890" dy="0">光头</tspan></text><text x="890" y="489" text-anchor="start" font-size="13" font-weight="650" fill="#75539c"><tspan x="890" dy="0">4 层</tspan></text><text x="30" y="605" text-anchor="start" font-size="16" font-weight="400" fill="#486476"><tspan x="30" dy="0">底部细蓝条示意可选硬涂层；多层记录区与覆盖层放大绘制，实际集中在近读盘面约 100 µm 内。</tspan></text></g></svg>