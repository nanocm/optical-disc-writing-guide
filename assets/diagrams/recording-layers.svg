<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">BD 单层至四层的完整盘体与层位</title><desc id="desc">四个盘体从上方印刷面、约 1.1 毫米基板、记录层与透明间隔层、覆盖层、表面硬涂层到下方读盘面。BDXL 多层记录区在同一面，由光头改变焦点读取。</desc><defs><marker id="beam-up" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0f7d99"/></marker><marker id="beam-down" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0f7d99"/></marker></defs><rect x="0" y="0" width="960" height="620" rx="0" fill="#f6fafc" stroke="none" /><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="30" y="45" text-anchor="start" font-size="28" font-weight="800" fill="#17364a"><tspan x="30" dy="0">BD：单层、双层、三层、四层</tspan></text><text x="30" y="72" text-anchor="start" font-size="16" font-weight="400" fill="#486476"><tspan x="30" dy="0">印刷面在上，读盘面在下；绿色表示记录层之间的透明材料。</tspan></text><rect x="25" y="90" width="210" height="488" rx="16" fill="#ffffff" stroke="#bfd5df" stroke-width="2"/><text x="41" y="125" text-anchor="start" font-size="19" font-weight="750" fill="#0e7195"><tspan x="41" dy="0">BD-R</tspan></text><text x="41" y="152" text-anchor="start" font-size="16" font-weight="400" fill="#486476"><tspan x="41" dy="0">25 GB · 单层</tspan></text><rect x="59" y="181" width="118" height="17" rx="0" fill="#eac5a7" stroke="#7998aa" /><rect x="59" y="198" width="118" height="272" rx="0" fill="#d5e8f4" stroke="#7998aa" /><text x="118" y="270" text-anchor="middle" font-size="17" font-weight="400" fill="#486476"><tspan x="118" dy="0">约 1.1 mm</tspan><tspan x="118" dy="24">基板</tspan></text><rect x="59" y="465" width="118" height="10" rx="0" fill="#0e7195" stroke="#5c7792" stroke-width="1"/><rect x="59" y="475" width="118" height="68" rx="0" fill="#9dd9e4" stroke="#7998aa" /><rect x="59" y="543" width="118" height="10" rx="0" fill="#58b6ca" stroke="#7998aa" /><text x="118" y="514" text-anchor="middle" font-size="13" font-weight="400" fill="#17364a"><tspan x="118" dy="0">覆盖层</tspan></text><path d="M118 573 L118 557" stroke="#0f7d99" stroke-width="2.5" fill="none" marker-end="url(#beam-up)"/><text x="185" y="571" text-anchor="start" font-size="13" font-weight="400" fill="#0d728e"><tspan x="185" dy="0">光头</tspan></text><text x="185" y="489" text-anchor="start" font-size="13" font-weight="650" fill="#0e7195"><tspan x="185" dy="0">1 层</tspan></text><rect x="260" y="90" width="210" height="488" rx="16" fill="#ffffff" stroke="#bfd5df" stroke-width="2"/><text x="276" y="125" text-anchor="start" font-size="19" font-weight="750" fill="#137c78"><tspan x="276" dy="0">BD-R DL</tspan></text><text x="276" y="152" text-anchor="start" font-size="16" font-weight="400" fill="#486476"><tspan x="276" dy="0">50 GB · 双层</tspan></text><rect x="294" y="181" width="118" height="17" rx="0" fill="#eac5a7" stroke="#7998aa" /><rect x="294" y="198" width="118" height="272" rx="0" fill="#d5e8f4" stroke="#7998aa" /><text x="353" y="270" text-anchor="middle" font-size="17" font-weight="400" fill="#486476"><tspan x="353" dy="0">约 1.1 mm</tspan><tspan x="353" dy="24">基板</tspan></text><rect x="294" y="465" width="118" height="10" rx="0" fill="#137c78" stroke="#5c7792" stroke-width="1"/><rect x="294" y="475" width="118" height="8" rx="0" fill="#d6e9d0" stroke="none" /><rect x="294" y="483" width="118" height="10" rx="0" fill="#137c78" stroke="#5c7792" stroke-width="1"/><rect x="294" y="493" width="118" height="50" rx="0" fill="#9dd9e4" stroke="#7998aa" /><rect x="294" y="543" width="118" height="10" rx="0" fill="#58b6ca" stroke="#7998aa" /><text x="353" y="523" text-anchor="middle" font-size="13" font-weight="400" fill="#17364a"><tspan x="353" dy="0">覆盖层</tspan></text><path d="M353 573 L353 557" stroke="#0f7d99" stroke-width="2.5" fill="none" marker-end="url(#beam-up)"/><text x="420" y="571" text-anchor="start" font-size="13" font-weight="400" fill="#0d728e"><tspan x="420" dy="0">光头</tspan