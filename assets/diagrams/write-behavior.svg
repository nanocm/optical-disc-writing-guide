<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="title desc"><title id="title">一次写入与可擦写盘的更新方式</title><desc id="desc">一次写入盘在新的区域记录同名新版；可擦写盘可在相应区域重写。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7195"/></marker></defs><rect width="960" height="410" fill="#f6fafc"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="30" y="46" text-anchor="start" font-size="27" font-weight="800" fill="#17364a">同名文件再次保存</text><text x="35" y="103" text-anchor="start" font-size="20" font-weight="750" fill="#0e7195">一次写入盘</text><rect x="205" y="73" width="190" height="72" rx="16" fill="#d7eaf4" stroke="#c8dce5" stroke-width="2"/><text x="300" y="116" text-anchor="middle" font-size="20" font-weight="700" fill="#17364a">旧版 A</text><rect x="400" y="73" width="95" height="72" rx="16" fill="#fff" stroke="#c8dce5" stroke-width="2"/><text x="447" y="116" text-anchor="middle" font-size="15" font-weight="400" fill="#17364a">其他数据</text><rect x="500" y="73" width="190" height="72" rx="16" fill="#bde5e4" stroke="#c8dce5" stroke-width="2"/><text x="595" y="116" text-anchor="middle" font-size="20" font-weight="700" fill="#17364a">新版 A</text><rect x="695" y="73" width="190" height="72" rx="16" fill="#e2f3d9" stroke="#c8dce5" stroke-width="2"/><text x="790" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="#17364a">目录改指新版</text><text x="205" y="176" text-anchor="start" font-size="18" font-weight="400" fill="#4c6474">旧版仍占空间；删除文件也不会腾出已写入的扇区。</text><text x="35" y="257" text-anchor="start" font-size="20" font-weight="750" fill="#157d76">可擦写盘</text><rect x="205" y="226" width="210" height="72" rx="16" fill="#d7eaf4" stroke="#c8dce5" stroke-width="2"/><text x="310" y="269" text-anchor="middle" font-size="20" font-weight="700" fill="#17364a">旧版 A</text><path d="M440 262 L555 262" fill="none" stroke="#0e7195" stroke-width="3" marker-end="url(#arrow)"/><rect x="575" y="226" width="310" height="72" rx="16" fill="#bde5e4" stroke="#c8dce5" stroke-width="2"/><text x="730" y="269" text-anchor="middle" font-size="20" font-weight="700" fill="#17364a">写成新版 A</text><text x="205" y="330" text-anchor="start" font-size="18" font-weight="400" fill="#4c6474">编辑器能否直接保存，取决于写入模式、文件系统和软件。</text><rect x="30" y="353" width="900" height="42" rx="9" fill="#fff" stroke="#c8dce5" stroke-width="2"/><text x="480" y="380" text-anchor="middle" font-size="17" font-weight="400" fill="#17364a">打开光盘时，资源管理器显示当前目录引用的文件。</text></g></svg>