<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 785" role="img" aria-labelledby="title desc"><title id="title">BD-ROM、BD-R HTL、BD-R LTH 与 BD-RE 盘体剖面</title><desc id="desc">BD 从覆盖层与表面硬涂层一侧读写。约 1.1 毫米基板位于印刷面与记录区之间；记录层材料随 BD-ROM、HTL、LTH、BD-RE 而异。</desc><defs><marker id="beam-up" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0f7d99"/></marker><marker id="beam-down" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0f7d99"/></marker></defs><rect x="0" y="0" width="960" height="785" rx="0" fill="#f6fafc" stroke="none" /><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="30" y="45" text-anchor="start" font-size="28" font-weight="800" fill="#17364a"><tspan x="30" dy="0">BD：记录区靠近读盘面</tspan></text><text x="30" y="72" text-anchor="start" font-size="16" font-weight="400" fill="#486476"><tspan x="30" dy="0">硬涂层位于覆盖层外侧，是否采用及具体材料依产品而定；图中薄膜放大。</tspan></text><rect x="25" y="91" width="445" height="310" rx="16" fill="#ffffff" stroke="#bfd5df" stroke-width="2"/><text x="45" y="125" text-anchor="start" font-size="20" font-weight="760" fill="#17364a"><tspan x="45" dy="0">BD-ROM · 单层</tspan></text><text x="45" y="150" text-anchor="start" font-size="15" font-weight="400" fill="#486476"><tspan x="45" dy="0">模压凹坑，无可写记录膜</tspan></text><rect x="45" y="170" width="125" height="14" rx="0" fill="#eac5a7" stroke="#7998aa" stroke-width="1"/><rect x="45" y="184" width="125" height="122" rx="0" fill="#d5e8f4" stroke="#7998aa" stroke-width="1"/><rect x="45" y="306" width="125" height="14" rx="0" fill="#9eafbb" stroke="#7998aa" stroke-width="1"/><rect x="54" y="314" width="9" height="5" rx="0" fill="#ffffff" stroke="none" /><rect x="77" y="314" width="9" height="5" rx="0" fill="#ffffff" stroke="none" /><rect x="100" y="314" width="9" height="5" rx="0" fill="#ffffff" stroke="none" /><rect x="123" y="314" width="9" height="5" rx="0" fill="#ffffff" strok