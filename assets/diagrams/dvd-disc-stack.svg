<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1110" role="img" aria-labelledby="title desc"><title id="title">DVD 只读、一次写入、可擦写、双层及双面盘剖面</title><desc id="desc">六种 DVD 示例均展示完整盘体。单面盘由两片约 0.6 毫米基板胶合，记录层在中部；双面盘两面都要读取。</desc><defs><marker id="beam-up" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0f7d99"/></marker><marker id="beam-down" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0f7d99"/></marker></defs><rect x="0" y="0" width="960" height="1110" rx="0" fill="#f6fafc" stroke="none" /><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="30" y="45" text-anchor="start" font-size="28" font-weight="800" fill="#17364a"><tspan x="30" dy="0">DVD：记录区夹在两片基板之间</tspan></text><text x="30" y="72" text-anchor="start" font-size="16" font-weight="400" fill="#486476"><tspan x="30" dy="0">单面盘从下表面读取；双层与双面是不同概念。</tspan></text><rect x="25" y="91" width="445" height="310" rx="16" fill="#ffffff" stroke="#bfd5df" stroke-width="2"/><text x="45" y="125" text-anchor="start" font-size="20" font-weight="760" fill="#17364a"><tspan x="45" dy="0">DVD-ROM · 单面单层</tspan></text><text x="45" y="150" text-anchor="start" font-size="15" font-weight="400" fill="#486476"><tspan x="45" dy="0">模压凹坑位于两片基板之间</tspan></text><rect x="45" y="170" width="125" height="14" rx="0" fill="#eac5a7" stroke="#7998aa" stroke-width="1"/><rect x="45" y="184" width="125" height="75" rx="0" fill="#d5e8f4" stroke="#7998aa" stroke-width="1"/><rect x="45" y="259" width="125" height="12" rx="0" fill="#b9dbc5" stroke="#7998aa" stroke-width="1"/><rect x="45" y="271" width="125" height="14" rx="0" fill="#9eafbb" stroke="#7998aa" stroke-width="1"/><rect x="54" y="279" width="9" height="5" rx="0" fill="#ffffff" stroke="none" /><rect x="77" y="279" width="9" height="5" rx="0" fill="#ffffff" stroke="none" /><rect x="100" y="279" width="9" height="5" rx="0" fill="#ffffff" stroke="none" /><r