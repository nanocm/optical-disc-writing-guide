<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 325" role="img" aria-labelledby="title desc"><title id="title">盘片批次记录</title><desc id="desc">记录商品号、包装声明、MID、内圈码及写入后的读回结果。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7195"/></marker></defs><rect width="960" height="325" fill="#f6fafc"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="30" y="47" text-anchor="start" font-size="27" font-weight="800" fill="#17364a">购买和刻录时需要留下的盘片信息</text><rect x="30" y="76" width="207" height="132" rx="16" fill="#e7f5fb" stroke="#c8dce5" stroke-width="2"/><text x="50" y="113" text-anchor="start" font-size="22" font-weight="750" fill="#0e7195">商品号</text><text x="50" y="145" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">确定销售系列</text><text x="50" y="171" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">如 Verbatim #43714</text><rect x="261" y="76" width="207" height="132" rx="16" fill="#e9f7f5" stroke="#c8dce5" stroke-width="2"/><text x="281" y="113" text-anchor="start" font-size="22" font-weight="750" fill="#157d76">包装声明</text><text x="281" y="145" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">品牌、产地、制造商</text><text x="281" y="171" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">留存包装照片</text><rect x="492" y="76" width="207" height="132" rx="16" fill="#fff3e8" stroke="#c8dce5" stroke-width="2"/><text x="512" y="113" text-anchor="start" font-size="22" font-weight="750" fill="#b55e2d">MID / 极性</text><text x="512" y="145" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">供固件选择写入策略</text><text x="512" y="171" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">确认 HTL / LTH</text><rect x="723" y="76" width="207" height="132" rx="16" fill="#f1edfa" stroke="#c8dce5" stroke-width="2"/><text x="743" y="113" text-anchor="start" font-size="22" font-weight="750" fill="#71529a">内圈码</text><text x="743" y="145" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">帮助追溯批次</text><text x="743" y="171" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">拍摄盘片内圈</text><path d="M480 214 L480 244" fill="none" stroke="#0e7195" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="249" width="660" height="58" rx="12" fill="#fff" stroke="#97bdcb" stroke-width="2"/><text x="480" y="285" text-anchor="middle" font-size="19" font-weight="700" fill="#17364a">刻录记录：光驱、固件、写速、校验和复查日期</text></g></svg>