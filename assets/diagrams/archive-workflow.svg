<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 325" role="img" aria-labelledby="title desc"><title id="title">数据光盘备份流程</title><desc id="desc">整理文件并生成校验清单，刻录后重插读回，登记盘片并保存另一副本。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7195"/></marker></defs><rect width="960" height="325" fill="#f6fafc"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="30" y="47" text-anchor="start" font-size="27" font-weight="800" fill="#17364a">从整理文件到读回校验</text><rect x="30" y="90" width="160" height="142" rx="16" fill="#e7f5fb" stroke="#c8dce5" stroke-width="2"/><text x="50" y="127" text-anchor="start" font-size="22" font-weight="750" fill="#0e7195">① 整理源文件</text><text x="50" y="159" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">固定目录</text><text x="50" y="185" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">不再改动源</text><path d="M194 160 L214 160" fill="none" stroke="#0e7195" stroke-width="3" marker-end="url(#arrow)"/><rect x="220" y="90" width="160" height="142" rx="16" fill="#e9f7f5" stroke="#c8dce5" stroke-width="2"/><text x="240" y="127" text-anchor="start" font-size="22" font-weight="750" fill="#157d76">② 生成清单</text><text x="240" y="159" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">逐文件 SHA-256</text><text x="240" y="185" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">硬盘留副本</text><path d="M384 160 L404 160" fill="none" stroke="#0e7195" stroke-width="3" marker-end="url(#arrow)"/><rect x="410" y="90" width="160" height="142" rx="16" fill="#fff3e8" stroke="#c8dce5" stroke-width="2"/><text x="430" y="127" text-anchor="start" font-size="22" font-weight="750" fill="#b55e2d">③ 刻录</text><text x="430" y="159" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">核对 Profile</text><text x="430" y="185" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">写入 + Verify</text><path d="M574 160 L594 160" fill="none" stroke="#0e7195" stroke-width="3" marker-end="url(#arrow)"/><rect x="600" y="90" width="160" height="142" rx="16" fill="#e7f5fb" stroke="#c8dce5" stroke-width="2"/><text x="620" y="127" text-anchor="start" font-size="22" font-weight="750" fill="#0e7195">④ 重插读回</text><text x="620" y="159" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">比较文件哈希</text><text x="620" y="185" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">必要时异机读</text><path d="M764 160 L784 160" fill="none" stroke="#0e7195" stroke-width="3" marker-end="url(#arrow)"/><rect x="790" y="90" width="140" height="142" rx="16" fill="#e9f7f5" stroke="#c8dce5" stroke-width="2"/><text x="810" y="127" text-anchor="start" font-size="22" font-weight="750" fill="#157d76">⑤ 登记保存</text><text x="810" y="159" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">盒装编号</text><text x="810" y="185" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">再留一副本</text><rect x="30" y="259" width="900" height="48" rx="9" fill="#fff" stroke="#c8dce5" stroke-width="2"/><text x="480" y="289" text-anchor="middle" font-size="17" font-weight="400" fill="#17364a">刻录当天的校验无法代替日后的抽检与资料迁移。</text></g></svg>