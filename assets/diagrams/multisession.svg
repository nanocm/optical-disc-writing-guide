<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">两次写入后的盘面与文件目录</title><desc id="desc">第二会话导入旧目录后可显示 A 和 B；未导入时当前目录可能只显示 B。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7195"/></marker></defs><rect width="960" height="430" fill="#f6fafc"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><text x="30" y="46" text-anchor="start" font-size="27" font-weight="800" fill="#17364a">第二次刻录后的目录</text><text x="30" y="110" text-anchor="start" font-size="20" font-weight="750" fill="#0e7195">盘上顺序</text><rect x="180" y="75" width="235" height="83" rx="16" fill="#d7eaf4" stroke="#c8dce5" stroke-width="2"/><text x="297" y="109" text-anchor="middle" font-size="19" font-weight="800" fill="#17364a">会话 1</text><text x="297" y="139" text-anchor="middle" font-size="17" font-weight="400" fill="#17364a">A.txt + 目录 A</text><rect x="420" y="75" width="65" height="83" rx="16" fill="#fff" stroke="#c8dce5" stroke-width="2"/><text x="452" y="123" text-anchor="middle" font-size="15" font-weight="400" fill="#17364a">间隔</text><rect x="490" y="75" width="255" height="83" rx="16" fill="#bde5e4" stroke="#c8dce5" stroke-width="2"/><text x="617" y="109" text-anchor="middle" font-size="19" font-weight="800" fill="#17364a">会话 2</text><text x="617" y="139" text-anchor="middle" font-size="17" font-weight="400" fill="#17364a">B.txt + 新目录</text><rect x="750" y="75" width="180" height="83" rx="16" fill="#f1f5f7" stroke="#c8dce5" stroke-width="2"/><text x="840" y="123" text-anchor="middle" font-size="17" font-weight="400" fill="#17364a">剩余空白</text><path d="M610 166 L610 216" fill="none" stroke="#0e7195" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="232" width="425" height="126" rx="16" fill="#e9f7f5" stroke="#c8dce5" stroke-width="2"/><text x="50" y="269" text-anchor="start" font-size="22" font-weight="750" fill="#157d76">导入旧目录</text><text x="50" y="301" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">新目录引用 A.txt 和 B.txt</text><text x="50" y="327" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">当前目录显示两份文件</text><rect x="505" y="232" width="425" height="126" rx="16" fill="#fff3e8" stroke="#c8dce5" stroke-width="2"/><text x="525" y="269" text-anchor="start" font-size="22" font-weight="750" fill="#b55e2d">没有导入旧目录</text><text x="525" y="301" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">新目录只列出 B.txt</text><text x="525" y="327" text-anchor="start" font-size="17" font-weight="400" fill="#4c6474">A 的扇区仍在，但可能不可见</text><text x="480" y="397" text-anchor="middle" font-size="18" font-weight="700" fill="#17364a">续写前，确认待刻录项目包含旧文件。</text></g></svg>